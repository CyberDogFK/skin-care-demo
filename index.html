<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glow Care — догляд за шкірою</title>
    <meta
      name="description"
      content="Glow Care — навчальний демо-магазин косметики для догляду за шкірою. Реальні замовлення та оплати не здійснюються."
    />
    <meta
      name="theme-color"
      content="#f7f2ec"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1b1613"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme before first paint (no flash). Same key/logic as ThemeContext. -->
    <script>
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('glowcare_theme')
        } catch (e) {
          // localStorage blocked (private mode, settings): use OS setting
        }
        var theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
